<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>IDOL</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: #0a0f0a;
        height: 100%;
        overflow: hidden;
        /* Safe areas (notch) — requisito mobile-first */
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
      }
      #game {
        width: 100%;
        height: 100%;
        /* Bloqueia zoom/scroll do browser durante gameplay */
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
