services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: idol
      POSTGRES_PASSWORD: idol
      POSTGRES_DB: idol
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U idol -d idol']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://idol:idol@postgres:5432/idol
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev-secret-nao-use-em-producao-0123456789
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  adminer:
    image: adminer:5
    ports:
      - '8080:8080'
    depends_on:
      - postgres

volumes:
  pgdata:
